# Relic Relapse: records for the pills and the relapse effects.
# Visuals reuse the game's own relic sickness effects, cloned under our own IDs so this mod
# never removes an effect a quest applied.

# --- Pseudoendotrizine (the pills) ---------------------------------------------------------

RelicRelapse.ConsumableBaseName:
  $type: gamedataConsumableBaseName_Record
  enumName: RelicRelapsePseudoendotrizine

UIIcon.relic_relapse_pills:
  $type: gamedataUIIcon_Record
  atlasPartName: johnny_pills
  atlasResourcePath: base\gameplay\gui\common\icons\mappin_icons.inkatlas

RelicRelapse.PillPrice:
  $type: gamedataConstantStatModifier_Record
  value: 400
  modifierType: Additive
  statType: BaseStats.Price

RelicRelapse.PillWeight:
  $type: gamedataConstantStatModifier_Record
  value: 0
  modifierType: Additive
  statType: BaseStats.Weight

RelicRelapse.PillAction:
  $type: gamedataItemAction_Record
  isDefaultLootChoice: False
  removeAfterUse: True
  actionName: Consume
  hackCategory: HackCategory.NotAHack
  objectActionType: ObjectActionType.Item
  priority: 0
  activationTime: []
  completionEffects: []
  costs: []
  durationTime: []
  instigatorActivePrereqs: []
  instigatorPrereqs: []
  interruptionPrereqs: []
  rewards: []
  startEffects: []
  targetActivePrereqs: []
  targetPrereqs: []

RelicRelapse.Pseudoendotrizine:
  $type: gamedataConsumableItem_Record
  consumableBaseName: RelicRelapse.ConsumableBaseName
  consumableType: ConsumableType.Drug
