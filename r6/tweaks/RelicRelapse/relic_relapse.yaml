# --- Effects ---------------------------------------------------------------------------------

# Screen distortion, breathing and sound: the game's own relic sickness, under our IDs.
RelicRelapse.WarningFX:
  $base: BaseStatusEffect.JohnnySicknessMedium

RelicRelapse.AttackFX:
  $base: BaseStatusEffect.JohnnySicknessHeavy

RelicRelapse.NoCyberware:
  $base: GameplayRestriction.NoCyberware

RelicRelapse.NoSprint:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.CanSprint
  modifierType: Multiplier
  value: 0

RelicRelapse.NoDodge:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.HasDodge
  modifierType: Multiplier
  value: 0

RelicRelapse.WarningSlow:
  $type: gamedataConstantStatModifier_Record
  statType: BaseStats.MaxSpeed
